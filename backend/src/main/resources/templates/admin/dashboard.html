<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Painel')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{admin/fragments :: sidebar}"></aside>
  <main class="content">
    <h1>Olá! 👋</h1>
    <p class="muted">Resumo da loja agora.</p>
    <div th:replace="~{admin/fragments :: flash}"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" th:text="${summary.products}">10</span>
        <span class="stat-label">Produtos</span>
      </div>
      <div class="stat">
        <span class="stat-value" th:text="${summary.outOfStock}">1</span>
        <span class="stat-label">Esgotados</span>
      </div>
      <div class="stat">
        <span class="stat-value" th:text="${summary.onSale}">3</span>
        <span class="stat-label">Em promoção</span>
      </div>
      <div class="stat pink">
        <span class="stat-value" th:text="${summary.pendingReviews}">0</span>
        <span class="stat-label">Avaliações aguardando</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>

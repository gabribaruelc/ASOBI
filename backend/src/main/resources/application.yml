spring:
  application:
    name: asobi-backend
  config:
    # Credenciais locais (DB_URL, DB_PASSWORD...) em backend/.env — ver .env.example.
    # No Cloud Run o arquivo não existe e as variáveis vêm do Secret Manager.
    import: optional:file:.env[.properties]
  profiles:
    # Sem perfil informado, roda com o banco H2 local (não precisa instalar nada).
    # Em produção (Cloud Run) usar SPRING_PROFILES_ACTIVE=prod.
    default: local
    group:
      prod: google, supabase
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é responsabilidade do Flyway (src/main/resources/db/migration);
      # o Hibernate só confere se as entidades batem com as tabelas.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # Tabelas criadas pelo Flyway (V5__create_spring_session_tables.sql).
      initialize-schema: never

server:
  # O Cloud Run informa a porta pela variável PORT.
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      # Sessão do painel admin.
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health

asobi:
  # Origem do frontend Next.js autorizada a chamar /api/** (CORS).
  # Várias origens separadas por vírgula.
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  # Endereço público da loja (links "ver na loja" no painel, retorno do pagamento).
  store-url: ${STORE_URL:http://localhost:3000}
  # Endereço público deste backend (usado no webhook do Mercado Pago).
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mercado-pago:
    # Vazio = modo manual (pagamentos confirmados pelo painel).
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  shipping-service:
    # Microsserviço de frete (../shipping-service, porta 8081 local). Vazio = frete automático
    # indisponível (o toggle no painel fica travado em "a combinar").
    url: ${SHIPPING_SERVICE_URL:}
    api-key: ${SHIPPING_SERVICE_API_KEY:}
  admin:
    # Primeiro admin, criado na subida só se a tabela admin_users estiver vazia.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    # Login só por e-mail, sem Google — apenas para desenvolvimento local.
    dev-login-enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # H2 em arquivo, em modo compatível com PostgreSQL, para as migrações
    # serem as mesmas do Supabase.
    url: jdbc:h2:file:./data/asobi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

asobi:
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:priscila@asobi.com.br}
    dev-login-enabled: true

---
# Login com Google. Ativado automaticamente em prod; localmente, use
# SPRING_PROFILES_ACTIVE=local,google com GOOGLE_CLIENT_ID/SECRET definidos.
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

---
# Banco Supabase. Ativado automaticamente em prod; localmente, use
# SPRING_PROFILES_ACTIVE=local,supabase (mantém o login de desenvolvimento).
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    # Supabase: usar a connection string do "Session pooler" (IPv4), ex.:
    # jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Free tier do Supabase tem poucas conexões; o Cloud Run pode subir
      # mais de uma instância.
      maximum-pool-size: 3
  flyway:
    # db/postgresql tem o que só roda no Postgres (ex.: RLS), fora do H2.
    locations: classpath:db/migration, classpath:db/postgresql

---
spring:
  config:
    activate:
      on-profile: prod

server:
  # O Cloud Run termina o HTTPS no proxy; isso garante que os redirects do
  # login com Google saiam com https://.
  forward-headers-strategy: framework

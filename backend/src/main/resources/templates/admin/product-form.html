<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${product == null ? 'Novo produto' : 'Editar produto'})}"></head>
<body>
<div class="shell">
  <aside th:replace="~{admin/fragments :: sidebar}"></aside>
  <main class="content">
    <p><a th:href="@{/admin/produtos}">← Produtos</a></p>
    <h1 th:text="${product == null ? 'Novo produto' : 'Editar: ' + product.name}">Novo produto</h1>
    <p class="muted" th:if="${product != null}">
      Link na loja: <a th:href="${storeUrl + '/jogos/' + product.slug}" target="_blank" rel="noopener"
                       th:text="${'/jogos/' + product.slug}">/jogos/slug</a>
    </p>
    <div th:replace="~{admin/fragments :: flash}"></div>

    <!-- Os botões "Tornar capa" e "Excluir" de cada foto enviam este formulário (atributo form=),
         porque não dá para ter um <form> dentro do formulário do produto. -->
    <form id="photoAction" th:action="@{/admin/produtos}" method="post" hidden></form>

    <form th:action="${product == null} ? @{/admin/produtos} : @{/admin/produtos/{id}(id=${product.id})}"
          th:object="${form}" method="post" enctype="multipart/form-data" class="card" novalidate>

      <p class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</p>

      <div class="form-grid">
        <label class="full">Nome
          <input type="text" th:field="*{name}" maxlength="150" required>
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>

        <div class="full fieldset">
          <label>Fotos
            <span class="hint" th:text="${'Até ' + maxImages + ' fotos por produto (JPG, PNG ou WebP). A primeira é a capa, que aparece no catálogo.'}">Até 6 fotos</span>
            <input type="file" name="photos" id="photos" accept="image/jpeg,image/png,image/webp" multiple
                   th:data-max-images="${maxImages}" th:data-current-images="${#lists.size(images)}">
          </label>
          <p class="hint" id="photosStatus" hidden></p>
          <div class="photo-grid" th:if="${!#lists.isEmpty(images)}">
            <figure class="photo" th:each="img, stat : ${images}">
              <img th:src="${img.url}" alt="" loading="lazy">
              <span class="badge blue" th:if="${stat.first}">Capa</span>
              <figcaption>
                <button type="submit" form="photoAction" class="link-button" th:unless="${stat.first}"
                        th:formaction="@{/admin/produtos/{id}/fotos/{imageId}/capa(id=${product.id},imageId=${img.id})}">Tornar capa</button>
                <button type="submit" form="photoAction" class="link-button danger"
                        th:formaction="@{/admin/produtos/{id}/fotos/{imageId}/excluir(id=${product.id},imageId=${img.id})}"
                        onclick="return confirm('Excluir esta foto? As outras alterações não salvas do formulário serão perdidas.');">Excluir</button>
              </figcaption>
            </figure>
          </div>
        </div>

        <label>Ícone <span class="hint">um emoji, usado enquanto o produto não tem foto</span>
          <input type="text" th:field="*{icon}" maxlength="16" placeholder="🎲">
          <span class="field-error" th:if="${#fields.hasErrors('icon')}" th:errors="*{icon}"></span>
        </label>

        <label>Faixa etária
          <select th:field="*{categoryId}" required>
            <option value="">Escolha…</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">4 a 6 anos</option>
          </select>
          <span class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
        </label>

        <label>Idade recomendada
          <input type="text" th:field="*{ageLabel}" maxlength="40" placeholder="6+ anos" required>
          <span class="field-error" th:if="${#fields.hasErrors('ageLabel')}" th:errors="*{ageLabel}"></span>
        </label>

        <label>Nº de jogadores
          <input type="text" th:field="*{players}" maxlength="60" placeholder="2 a 4 jogadores" required>
          <span class="field-error" th:if="${#fields.hasErrors('players')}" th:errors="*{players}"></span>
        </label>

        <label class="full">Habilidade estimulada
          <input type="text" th:field="*{skill}" maxlength="100" placeholder="Raciocínio lógico" required>
          <span class="field-error" th:if="${#fields.hasErrors('skill')}" th:errors="*{skill}"></span>
        </label>

        <label class="full">Descrição
          <textarea th:field="*{description}" maxlength="4000" required></textarea>
          <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </label>

        <label>Preço normal (R$)
          <input type="number" th:field="*{regularPrice}" min="0.01" step="0.01" required>
          <span class="field-error" th:if="${#fields.hasErrors('regularPrice')}" th:errors="*{regularPrice}"></span>
        </label>

        <label>Estoque
          <input type="number" th:field="*{stock}" min="0" step="1" required>
          <span class="hint">0 = aparece como esgotado na loja</span>
          <span class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
        </label>

        <div class="full fieldset">
          <label class="checkbox"><input type="checkbox" th:field="*{onSale}" id="onSale"> Em promoção</label>
          <label id="salePriceField">Preço promocional (R$)
            <input type="number" th:field="*{salePrice}" min="0.01" step="0.01">
            <span class="hint">O preço normal aparece riscado na loja. Ao tirar da promoção, volta ao preço normal.</span>
            <span class="field-error" th:if="${#fields.hasErrors('salePrice')}" th:errors="*{salePrice}"></span>
          </label>
        </div>

        <div class="full fieldset">
          <label>Fica em Novidades até <span class="hint">vazio = não aparece em Novidades</span>
            <input type="date" th:field="*{newUntil}" id="newUntil">
          </label>
          <div class="quick-dates">
            <button type="button" class="button secondary small" data-days="7">+7 dias</button>
            <button type="button" class="button secondary small" data-days="15">+15 dias</button>
            <button type="button" class="button secondary small" data-days="30">+30 dias</button>
            <button type="button" class="button secondary small" data-days="0">Tirar de Novidades</button>
          </div>
        </div>

        <label class="checkbox full"><input type="checkbox" th:field="*{cooperative}"> Jogo cooperativo (aparece no filtro "Cooperativos")</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="button" id="saveButton" th:text="${product == null ? 'Cadastrar produto' : 'Salvar alterações'}">Salvar</button>
        <a th:href="@{/admin/produtos}" class="button secondary">Cancelar</a>
      </div>
    </form>
  </main>
</div>
<script>
  // Mostra o preço promocional só quando "Em promoção" está marcado.
  const onSale = document.getElementById("onSale");
  const saleField = document.getElementById("salePriceField");
  const toggleSale = () => { saleField.hidden = !onSale.checked; };
  onSale.addEventListener("change", toggleSale);
  toggleSale();

  // Atalhos de data para Novidades (a partir de hoje).
  const newUntil = document.getElementById("newUntil");
  document.querySelectorAll("[data-days]").forEach((button) => {
    button.addEventListener("click", () => {
      const days = Number(button.dataset.days);
      if (days === 0) { newUntil.value = ""; return; }
      const date = new Date();
      date.setDate(date.getDate() + days);
      newUntil.value = date.toLocaleDateString("sv-SE"); // yyyy-mm-dd no fuso local
    });
  });

  // Fotos: reduz no navegador antes de enviar (foto de celular tem vários MB), para o
  // envio ser rápido e as fotos ocuparem pouco espaço e pouca banda no Supabase.
  const photos = document.getElementById("photos");
  const photosStatus = document.getElementById("photosStatus");
  const saveButton = document.getElementById("saveButton");
  const MAX_SIDE = 1600;
  const MAX_BYTES = 5 * 1024 * 1024;

  const showPhotosStatus = (text) => {
    photosStatus.textContent = text;
    photosStatus.hidden = !text;
  };

  async function shrinkPhoto(file) {
    const bitmap = await createImageBitmap(file); // já respeita a rotação da foto do celular
    const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && file.size <= 400 * 1024) return file;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const context = canvas.getContext("2d");
    context.fillStyle = "#FFFFFF"; // PNG transparente vira fundo branco no JPG
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  }

  photos.addEventListener("change", async () => {
    const selected = Array.from(photos.files);
    showPhotosStatus("");
    if (selected.length === 0) return;

    const free = Number(photos.dataset.maxImages) - Number(photos.dataset.currentImages);
    if (selected.length > free) {
      photos.value = "";
      showPhotosStatus(free > 0
        ? "Só cabe(m) mais " + free + " foto(s) neste produto. Escolha de novo."
        : "Este produto já tem o máximo de fotos. Exclua alguma antes de enviar outra.");
      return;
    }

    saveButton.disabled = true;
    showPhotosStatus("Preparando as fotos…");
    try {
      const prepared = new DataTransfer();
      for (const file of selected) {
        // Se o navegador não conseguir reduzir, manda o arquivo original mesmo.
        prepared.items.add(await shrinkPhoto(file).catch(() => file));
      }
      photos.files = prepared.files;
    } catch (error) {
      // Navegador antigo: segue com os arquivos originais.
    }
    saveButton.disabled = false;

    const tooBig = Array.from(photos.files).find((file) => file.size > MAX_BYTES);
    if (tooBig) {
      photos.value = "";
      showPhotosStatus("\"" + tooBig.name + "\" é grande demais (máximo de 5 MB por foto).");
      return;
    }
    showPhotosStatus(photos.files.length + " foto(s) pronta(s). Elas são enviadas ao salvar.");
  });
</script>
</body>
</html>

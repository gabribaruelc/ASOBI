# Sobe os serviços Java localmente, cada um na sua porta:
#   backend             http://localhost:8080  (API da loja + painel admin)
#   shipping-service    http://localhost:8081  (cotação de frete)
#   admin-auth-service  http://localhost:8083  (lista de admins e login Google do painel)
# A loja (frontend/) roda à parte com `npm run dev` em http://localhost:3000.
#
# Uso: docker compose up --build
# Para cotar de verdade: MELHOR_ENVIO_TOKEN=<token-sandbox> docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Perfil local: banco H2 dentro do container e login de desenvolvimento no painel.
      SPRING_PROFILES_ACTIVE: local
      SHIPPING_SERVICE_URL: http://shipping-service:8081
      SHIPPING_SERVICE_API_KEY: dev-shipping-key
      ADMIN_AUTH_SERVICE_URL: http://admin-auth-service:8083
      ADMIN_AUTH_SERVICE_API_KEY: dev-admin-auth-key
    volumes:
      # banco H2 e fotos: sobrevivem a `docker compose down` / `up --build`
      - backend-data:/app/data
    depends_on:
      - shipping-service
      - admin-auth-service

  shipping-service:
    build: ./shipping-service
    ports:
      - "8081:8081"
    environment:
      SHIPPING_SERVICE_API_KEY: dev-shipping-key
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      MELHOR_ENVIO_SANDBOX: "true"

  admin-auth-service:
    build: ./admin-auth-service
    ports:
      - "8083:8083"
    environment:
      # Perfil local: banco H2 dentro do container, com admin@asobi.com.br como admin inicial.
      SPRING_PROFILES_ACTIVE: local
      ADMIN_AUTH_SERVICE_API_KEY: dev-admin-auth-key
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@asobi.com.br}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - admin-auth-data:/app/data

volumes:
  backend-data:
  admin-auth-data:

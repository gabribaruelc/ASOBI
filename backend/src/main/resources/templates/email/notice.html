<!DOCTYPE html>
<!-- Aviso curto para os admins (ex.: estoque baixo). Montado pelo StockEmailComposer.
     Estilos inline e tabelas: é o que os programas de e-mail entendem. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${heading}">ASOBI</title>
</head>
<body style="margin:0;padding:0;background:#EAF2FF;color:#1E2A45;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;font-size:16px;line-height:1.5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EAF2FF;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:20px;">
        <tr>
          <td style="padding:28px 32px 0;font-size:34px;font-weight:bold;letter-spacing:-1px;">
            <span style="color:#2E7CF6;">aso</span><span style="color:#FF5FA2;">bi</span>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 0;">
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#1E2A45;" th:text="${heading}">Estoque baixo</h1>
            <p style="margin:0 0 10px;" th:each="paragraph : ${paragraphs}" th:text="${paragraph}">Corrida dos Sapos está acabando.</p>
            <p style="margin:14px 0 0;padding:12px 16px;background:#FFEAF3;border-radius:12px;font-weight:bold;"
               th:if="${highlight != null}" th:text="${highlight}">Restam 2 unidades</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:26px 32px 0;">
            <a th:href="${buttonUrl}" href="#" th:text="${buttonLabel}"
               style="display:inline-block;background:#FF5FA2;color:#FFFFFF;font-weight:bold;text-decoration:none;padding:12px 28px;border-radius:999px;">Abrir no painel</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 28px;font-size:12px;color:#5B6680;" th:text="${footerNote}">
            Aviso automático do painel ASOBI.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

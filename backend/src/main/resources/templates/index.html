<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASOBI · backend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #FFFFFF; color: #1E2A45; font-family: "Nunito", sans-serif; }
    main { text-align: center; padding: 16px; }
    h1 { font-family: "Fredoka", sans-serif; font-size: 3rem; margin: 0; }
    .aso { color: #2E7CF6; } .bi { color: #FF5FA2; }
    .pill { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 999px;
            background: #EAF2FF; color: #1E5FD1; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1><span class="aso">aso</span><span class="bi">bi</span></h1>
    <p><span th:text="${serviceName}">asobi-backend</span> no ar 🎲</p>
    <span class="pill">Painel admin em construção</span>
  </main>
</body>
</html>

<!DOCTYPE html>
<!-- Newsletter escrita no painel. Montado pelo NewsletterEmailComposer.
     Estilos inline e tabelas: é o que os programas de e-mail entendem. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">ASOBI</title>
</head>
<body style="margin:0;padding:0;background:#EAF2FF;color:#1E2A45;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;font-size:16px;line-height:1.5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EAF2FF;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:20px;">
        <tr>
          <td style="padding:28px 32px 0;font-size:34px;font-weight:bold;letter-spacing:-1px;">
            <span style="color:#2E7CF6;">aso</span><span style="color:#FF5FA2;">bi</span>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 0;">
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#1E2A45;" th:text="${subject}">Jogos novos chegando!</h1>
            <p style="margin:0 0 12px;white-space:pre-line;" th:each="paragraph : ${paragraphs}" th:text="${paragraph}">Oi! Chegaram jogos novos na loja.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:14px 32px 0;">
            <a th:href="${buttonUrl}" href="#" th:text="${buttonLabel}"
               style="display:inline-block;background:#FF5FA2;color:#FFFFFF;font-weight:bold;text-decoration:none;padding:12px 28px;border-radius:999px;">Ver os jogos na loja</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 28px;font-size:12px;color:#5B6680;">
            Você recebeu este e-mail porque se inscreveu na newsletter da ASOBI.<br>
            <a th:href="${unsubscribeUrl}" href="#" style="color:#5B6680;">Não quero mais receber a newsletter</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

# Sobe os serviços Java localmente, cada um na sua porta:
#   backend               http://localhost:8080  (API da loja + painel admin)
#   shipping-service      http://localhost:8081  (cotação de frete)
#   two-factor-service    http://localhost:8082  (código de verificação por e-mail)
#   admin-auth-service    http://localhost:8083  (lista de admins e login Google do painel)
#   notification-service  http://localhost:8084  (avisos de promoção e de volta ao estoque)
#   status-service        http://localhost:8085  (avisa os admins quando algo sai do ar)
# A loja (frontend/) roda à parte com `npm run dev` em http://localhost:3000.
#
# Uso: docker compose up --build
# Para cotar de verdade: MELHOR_ENVIO_TOKEN=<token-sandbox> docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Perfil local: banco H2 dentro do container e login de desenvolvimento no painel.
      SPRING_PROFILES_ACTIVE: local
      SHIPPING_SERVICE_URL: http://shipping-service:8081
      SHIPPING_SERVICE_API_KEY: dev-shipping-key
      ADMIN_AUTH_SERVICE_URL: http://admin-auth-service:8083
      ADMIN_AUTH_SERVICE_API_KEY: dev-admin-auth-key
      # Com esta URL o painel pede, depois do login, o código enviado por e-mail. Sem RESEND_API_KEY
      # o código aparece em `docker compose logs -f two-factor-service`. Apague a linha para entrar direto.
      TWO_FACTOR_SERVICE_URL: http://two-factor-service:8082
      TWO_FACTOR_SERVICE_API_KEY: dev-two-factor-key
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      NOTIFICATION_SERVICE_API_KEY: dev-notification-key
    volumes:
      # banco H2 e fotos: sobrevivem a `docker compose down` / `up --build`
      - backend-data:/app/data
    depends_on:
      - shipping-service
      - admin-auth-service
      - two-factor-service
      - notification-service

  shipping-service:
    build: ./shipping-service
    ports:
      - "8081:8081"
    environment:
      SHIPPING_SERVICE_API_KEY: dev-shipping-key
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      MELHOR_ENVIO_SANDBOX: "true"

  admin-auth-service:
    build: ./admin-auth-service
    ports:
      - "8083:8083"
    environment:
      # Perfil local: banco H2 dentro do container, com admin@asobi.com.br como admin inicial.
      SPRING_PROFILES_ACTIVE: local
      ADMIN_AUTH_SERVICE_API_KEY: dev-admin-auth-key
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@asobi.com.br}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - admin-auth-data:/app/data

  # Sem RESEND_API_KEY os e-mails dos dois serviços abaixo só aparecem no log de cada um.
  two-factor-service:
    build: ./two-factor-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      TWO_FACTOR_SERVICE_API_KEY: dev-two-factor-key
      TWO_FACTOR_CODE_SECRET: dev-two-factor-code-secret
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - two-factor-data:/app/data

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local
      NOTIFICATION_SERVICE_API_KEY: dev-notification-key
      PUBLIC_URL: http://localhost:8084
      STORE_URL: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - notification-data:/app/data

  # Confere os outros a cada chamada de POST /api/checks (no ar, o Cloud Scheduler chama de 5 em 5 minutos):
  #   curl -X POST localhost:8085/api/checks -H "X-Api-Key: dev-status-key"
  # Sem RESEND_API_KEY o aviso aparece em `docker compose logs -f status-service`.
  status-service:
    build: ./status-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: local
      STATUS_SERVICE_API_KEY: dev-status-key
      ADMIN_AUTH_SERVICE_URL: http://admin-auth-service:8083
      ADMIN_AUTH_SERVICE_API_KEY: dev-admin-auth-key
      STORE_URL: http://host.docker.internal:3000
      BACKEND_URL: http://backend:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8081
      TWO_FACTOR_SERVICE_URL: http://two-factor-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - status-data:/app/data

volumes:
  backend-data:
  admin-auth-data:
  two-factor-data:
  notification-data:
  status-data:

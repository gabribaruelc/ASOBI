spring:
  application:
    name: shipping-service
  config:
    import: optional:file:.env[.properties]

server:
  # 8080 já é do backend
  port: ${PORT:8081}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # o status-service lê quais partes caíram (só nome e UP/DOWN, sem detalhes)
      show-components: always
      # as conferências chamam serviços de fora; não repetir a cada acesso
      cache:
        time-to-live: 60s

shipping-service:
  # vazia = não confere o X-Api-Key (só local)
  api-key: ${SHIPPING_SERVICE_API_KEY:}

melhor-envio:
  # vazio = cotação indisponível
  token: ${MELHOR_ENVIO_TOKEN:}
  sandbox: ${MELHOR_ENVIO_SANDBOX:true}
  contact-email: ${MELHOR_ENVIO_CONTACT_EMAIL:contato@asobi.com.br}

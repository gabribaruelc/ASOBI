spring:
  datasource:
    url: jdbc:h2:mem:asobi-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

asobi:
  storage:
    local-dir: target/test-uploads
  admin:
    bootstrap-email: admin@asobi.com.br
    dev-login-enabled: true
  # o backend/.env local pode ter a senha; nos testes, só AdminPasswordTests liga
  admin-password:
    hash: ""
  # idem para a chave das rotinas: só os testes que precisam ligam
  jobs:
    api-key: ""

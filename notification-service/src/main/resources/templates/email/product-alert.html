<!DOCTYPE html>
<!-- Aviso de "entrou em promoção" / "voltou ao estoque" / "está acabando". Montado pelo AlertEmailComposer.
     Estilos inline e tabelas: é o que os programas de e-mail entendem. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${heading}">ASOBI</title>
</head>
<body style="margin:0;padding:0;background:#EAF2FF;color:#1E2A45;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;font-size:16px;line-height:1.5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EAF2FF;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:20px;">
        <tr>
          <td style="padding:28px 32px 0;font-size:34px;font-weight:bold;letter-spacing:-1px;">
            <span style="color:#2E7CF6;">aso</span><span style="color:#FF5FA2;">bi</span>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 0;">
            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#1E2A45;" th:text="${heading}">Entrou em promoção!</h1>
            <p style="margin:0;" th:text="${intro}">Boa notícia: o jogo que você estava de olho está com preço especial.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFEAF3;border-radius:16px;">
              <tr>
                <td style="padding:16px 20px;">
                  <div style="font-size:20px;font-weight:bold;" th:text="${productName}">Corrida dos Sapos</div>
                  <div style="margin-top:6px;">
                    <span style="color:#5B6680;text-decoration:line-through;margin-right:8px;"
                          th:if="${originalPrice != null}" th:text="${originalPrice}">R$ 99,90</span>
                    <span style="font-size:22px;font-weight:bold;color:#2E7CF6;" th:text="${price}">R$ 79,90</span>
                  </div>
                  <div style="margin-top:6px;font-weight:bold;color:#E8408A;" th:if="${stockNote != null}" th:text="${stockNote}">Restam só 2 unidades</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:26px 32px 0;">
            <a th:href="${productUrl}" href="#"
               style="display:inline-block;background:#FF5FA2;color:#FFFFFF;font-weight:bold;text-decoration:none;padding:12px 28px;border-radius:999px;">Ver o jogo na loja</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 28px;font-size:12px;color:#5B6680;">
            <span th:text="${reason}">Você recebeu este e-mail porque pediu para ser avisado.</span><br>
            <a th:href="${unsubscribeUrl}" href="#" style="color:#5B6680;">Não quero mais receber este aviso</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

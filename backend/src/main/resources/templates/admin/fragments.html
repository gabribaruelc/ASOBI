<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Painel ASOBI'">Painel ASOBI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<aside th:fragment="sidebar" class="sidebar">
  <a th:href="@{/admin}" class="logo"><span class="aso">aso</span><span class="bi">bi</span> <small>admin</small></a>
  <nav>
    <a th:href="@{/admin}" th:classappend="${currentPath == '/admin'} ? 'active'">🏠 Painel</a>
    <a th:href="@{/admin/pedidos}" th:classappend="${#strings.startsWith(currentPath, '/admin/pedidos')} ? 'active'">📦 Pedidos</a>
    <a th:href="@{/admin/produtos}" th:classappend="${#strings.startsWith(currentPath, '/admin/produtos')} ? 'active'">🎲 Produtos</a>
    <a th:href="@{/admin/categorias}" th:classappend="${#strings.startsWith(currentPath, '/admin/categorias')} ? 'active'">🧸 Faixas etárias</a>
    <a th:href="@{/admin/avaliacoes}" th:classappend="${#strings.startsWith(currentPath, '/admin/avaliacoes')} ? 'active'">⭐ Avaliações</a>
    <a th:href="@{/admin/sobre}" th:classappend="${#strings.startsWith(currentPath, '/admin/sobre')} ? 'active'">📖 Página Sobre</a>
    <a th:href="@{/admin/admins}" th:classappend="${#strings.startsWith(currentPath, '/admin/admins')} ? 'active'">🔑 Admins</a>
  </nav>
  <div class="sidebar-footer">
    <span class="muted" th:text="${currentAdminEmail}">dona@asobi.com.br</span>
    <form th:action="@{/admin/logout}" method="post">
      <button type="submit" class="link-button">Sair</button>
    </form>
  </div>
</aside>

<div th:fragment="flash">
  <p class="alert success" th:if="${success}" th:text="${success}">Salvo!</p>
  <p class="alert error" th:if="${error}" th:text="${error}">Erro</p>
</div>

<span th:fragment="statusBadge(o)" th:remove="tag">
  <span class="badge gray" th:if="${o.status.name() == 'PENDING_PAYMENT'}" th:text="${o.status.label}">Aguardando pagamento</span>
  <span class="badge pink" th:if="${o.status.name() == 'PAID'}" th:text="${o.status.label}">Pago</span>
  <span class="badge green" th:if="${o.status.name() == 'SHIPPED'}" th:text="${o.status.label}">Enviado</span>
  <span class="badge red" th:if="${o.status.name() == 'CANCELED'}" th:text="${o.status.label}">Cancelado</span>
  <span class="badge red" th:if="${o.stockIssue}">⚠ Estoque insuficiente</span>
</span>

</body>
</html>

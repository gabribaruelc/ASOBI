<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Painel ASOBI'">Painel ASOBI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<aside th:fragment="sidebar" class="sidebar">
  <a th:href="@{/admin}" class="logo"><span class="aso">aso</span><span class="bi">bi</span> <small>admin</small></a>
  <nav>
    <a th:href="@{/admin}" th:classappend="${currentPath == '/admin'} ? 'active'">🏠 Painel</a>
    <a th:href="@{/admin/admins}" th:classappend="${#strings.startsWith(currentPath, '/admin/admins')} ? 'active'">🔑 Admins</a>
  </nav>
  <div class="sidebar-footer">
    <span class="muted" th:text="${currentAdminEmail}">dona@asobi.com.br</span>
    <form th:action="@{/admin/logout}" method="post">
      <button type="submit" class="link-button">Sair</button>
    </form>
  </div>
</aside>

<div th:fragment="flash">
  <p class="alert success" th:if="${success}" th:text="${success}">Salvo!</p>
  <p class="alert error" th:if="${error}" th:text="${error}">Erro</p>
</div>

</body>
</html>

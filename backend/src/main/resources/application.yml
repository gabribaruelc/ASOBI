spring:
  application:
    name: asobi-backend
  config:
    # backend/.env local (ver .env.example); no Cloud Run vem do Secret Manager
    import: optional:file:.env[.properties]
  profiles:
    # H2 local por padrão; em produção SPRING_PROFILES_ACTIVE=prod
    default: local
    group:
      prod: google, supabase
  jpa:
    open-in-view: false
    hibernate:
      # esquema fica a cargo do Flyway
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # criadas na V5__create_spring_session_tables.sql
      initialize-schema: never
  servlet:
    multipart:
      # Upload de fotos no painel. O limite "de verdade" (5 MB por foto) é conferido no
      # ProductImageService, com mensagem amigável; estes ficam um pouco acima.
      # O Cloud Run aceita no máximo 32 MB por requisição.
      max-file-size: 8MB
      max-request-size: 32MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health

asobi:
  # CORS de /api/**, separadas por vírgula
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  store-url: ${STORE_URL:http://localhost:3000}
  # usado na URL do webhook do Mercado Pago
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mercado-pago:
    # vazio = modo manual
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  shipping-service:
    # vazio = frete automático indisponível
    url: ${SHIPPING_SERVICE_URL:}
    api-key: ${SHIPPING_SERVICE_API_KEY:}
  storage:
    # Fotos de produto no Supabase Storage. Vazio = pasta local (só para desenvolvimento;
    # no Cloud Run o disco some a cada nova instância).
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_KEY:}
    # Bucket público; criado sozinho no primeiro envio se ainda não existir.
    bucket: ${SUPABASE_STORAGE_BUCKET:product-images}
    local-dir: ./data/uploads
  customer-auth:
    # Login de cliente (Google pelo Supabase Auth): o backend confere o token no próprio
    # Supabase. Usa as mesmas variáveis das fotos; vazio = login de cliente desligado.
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_KEY:}
  email:
    # E-mails de pedido (recebido, pago, enviado) pelo Resend. Vazio = só aparecem no log.
    resend-api-key: ${RESEND_API_KEY:}
    # O domínio do remetente precisa estar verificado no Resend. O remetente de teste
    # (onboarding@resend.dev) só entrega para o e-mail dono da conta do Resend.
    from: ${EMAIL_FROM:ASOBI <onboarding@resend.dev>}
    # Para onde vão as respostas dos clientes (e-mail de atendimento). Opcional.
    reply-to: ${EMAIL_REPLY_TO:}
  admin-auth-service:
    # Dono da lista de admins e da conferência do login Google do painel.
    # Vazio = lista em memória só com o bootstrap-email abaixo: some a cada reinício (testes).
    url: ${ADMIN_AUTH_SERVICE_URL:}
    api-key: ${ADMIN_AUTH_SERVICE_API_KEY:}
  two-factor-service:
    # Segundo passo do login do painel: código enviado para o e-mail do admin.
    # Vazio = o painel pede só o login.
    url: ${TWO_FACTOR_SERVICE_URL:}
    api-key: ${TWO_FACTOR_SERVICE_API_KEY:}
  notification-service:
    # Avisos de "entrou em promoção" e "voltou ao estoque". Vazio = a loja não mostra o "avise-me".
    url: ${NOTIFICATION_SERVICE_URL:}
    api-key: ${NOTIFICATION_SERVICE_API_KEY:}
  admin:
    # só vale sem o admin-auth-service; com ele, o primeiro admin é configurado lá
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    dev-login-enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # modo PostgreSQL para usar as mesmas migrações do Supabase
    url: jdbc:h2:file:./data/asobi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

asobi:
  admin-auth-service:
    # Localmente o painel já espera o admin-auth-service rodando (../admin-auth-service), que
    # guarda a lista de admins em disco. Para rodar só o backend, com a lista em memória,
    # defina ADMIN_AUTH_SERVICE_URL vazia.
    url: ${ADMIN_AUTH_SERVICE_URL:http://localhost:8083}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@asobi.com.br}
    dev-login-enabled: true

---
# local: SPRING_PROFILES_ACTIVE=local,google
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

---
# local: SPRING_PROFILES_ACTIVE=local,supabase
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    # connection string do Session pooler (IPv4), ex.:
    # jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # free tier tem poucas conexões e o Cloud Run pode subir várias instâncias
      maximum-pool-size: 3
  flyway:
    # db/postgresql: só Postgres (RLS)
    locations: classpath:db/migration, classpath:db/postgresql

---
spring:
  config:
    activate:
      on-profile: prod

server:
  # HTTPS termina no proxy do Cloud Run; sem isso o redirect do OAuth sai em http
  forward-headers-strategy: framework

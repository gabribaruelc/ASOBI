<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Entrar')}"></head>
<body class="login-page">
<main class="login-card">
  <h1 class="logo big"><span class="aso">aso</span><span class="bi">bi</span></h1>
  <p class="muted">Painel da loja</p>

  <p class="alert error" th:if="${param.error}">Este e-mail não tem acesso ao painel.</p>
  <p class="alert error" th:if="${param.denied}">Seu acesso ao painel foi removido ou expirou.</p>
  <p class="alert success" th:if="${param.logout}">Você saiu do painel.</p>

  <a th:if="${googleEnabled}" th:href="@{/oauth2/authorization/google}" class="button google">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Entrar com Google
  </a>

  <form th:if="${devLoginEnabled}" th:action="@{/admin/dev-login}" method="post" class="dev-login">
    <p class="muted small">Modo desenvolvimento: entrar só com o e-mail de admin.</p>
    <label>E-mail
      <input type="email" name="email" required placeholder="dona@asobi.com.br">
    </label>
    <button type="submit" class="button">Entrar</button>
  </form>

  <p th:unless="${googleEnabled or devLoginEnabled}" class="alert error">
    Login não configurado. Defina GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET.
  </p>
</main>
</body>
</html>
